name: Provision Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-and-bootstrap:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
      CREATE_TABLES: "false"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      BOOTSTRAP_ADMIN_NAME: Administrador GeoMidia
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m app.cli bootstrap-admin
        working-directory: backend
